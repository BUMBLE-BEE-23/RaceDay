
name: RaceDay CI

on:
  push:
    branches: [ main, part2-rest-api ]
  pull_request:
    branches: [ main, part2-rest-api ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Part 1 documentation
        shell: bash
        run: |
          test -f README.md
          test -f docs/RaceDay-ERD.png
          test -f docs/endpoint-plan.md
          test -f docs/RaceDay-Database.sql
          test -f docs/CI-CD-Success.png

      - name: Restore API dependencies
        run: dotnet restore Part2/RaceDay.API/RaceDay.API.csproj

      - name: Build API
        run: dotnet build Part2/RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --verbosity normal
