name: RaceDay API CI

on:
  push:
    branches: [ main, part2-rest-api ]
  pull_request:
    branches: [ main, part2-rest-api ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
